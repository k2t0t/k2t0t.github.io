<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>services/config — need help on linux?</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .log-line--heading     { color: var(--accent-amber-bright); font-weight: 700; font-size: 1rem; margin-top: 6px; }
        .log-line--body        { color: var(--text-secondary); padding-left: 2px; }
        .log-line--indent      { color: var(--text-secondary); padding-left: 20px; }
        .log-line--cmd-example { color: var(--accent-amber); padding-left: 20px; }
        .log-line--divider     { color: var(--border-strong); letter-spacing: 2px; }
        .terminal-log          { margin-bottom: 12px; }
        .file-unread           { color: var(--text-primary); }
        .file-read             { color: var(--text-dim); }
    </style>
</head>
<body>
    <p class="eyebrow"><span class="prompt-symbol">frhs@ubuntu:~/home/frhs/services/config#</span></p>
    <h1>services/config</h1>
    <h2>service-specific security configurations</h2>

    <div id="terminal-log" class="terminal-log" role="log" aria-live="polite"></div>

    <div class="terminal-input" id="input-row">
        <span class="prompt-symbol">frhs@ubuntu:~/home/frhs/services/config#</span>
        <input type="text" id="cmd-input" class="cmd-input"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="try: ls" aria-label="Terminal command input">
    </div>

    <div class="terminal-input" id="nav-hint" style="display:none">
        <span class="prompt-symbol">frhs@ubuntu:~/home/frhs/services/config#</span>
        <input type="text" id="nav-input" class="cmd-input"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="cd .. to go back to services" aria-label="Navigation input">
    </div>

    <noscript>
        <p>Enable JavaScript to use the interactive terminal.</p>
        <a href="pas.html"><button>Back to Services</button></a>
    </noscript>

    <script>
    (function () {
        var PROMPT = 'frhs@ubuntu:~/home/frhs/services/config# ';
        var input    = document.getElementById('cmd-input');
        var log      = document.getElementById('terminal-log');
        var hint     = document.getElementById('nav-hint');
        var inputRow = document.getElementById('input-row');

        var read = {
            'README':        false,
            'ssh.conf':      false,
            'vsftpd.conf':   false,
            'apache.conf':   false,
            'nginx.conf':    false,
            'php.conf':      false,
            'mysql.conf':    false
        };
        var FILES    = Object.keys(read);
        var COMMANDS = ['ls', 'cat', 'cd', 'pwd'];
        var CD_MAIN  = ['..', '~', '/home'];
        var CD_NAV   = ['..', '/home', '../../basics', '../../users', '../../passwords', '../../files', '../../ssh', '../../firewall', '../../backdoors'];

        function addLine(text, cls) {
            var p = document.createElement('p');
            p.className = 'log-line ' + (cls || '');
            p.textContent = text;
            log.appendChild(p);
            return p;
        }
        function addBlank() { return addLine('', ''); }
        function scrollToEl(el) {
            requestAnimationFrame(function() { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        }
        function updatePlaceholder() {
            var unread = FILES.filter(function(f){ return !read[f]; });
            input.placeholder = unread.length === 0
                ? 'all files read! cd .. to go back'
                : 'try: cat ' + unread[0];
        }

        function tabComplete(inputEl, availableFiles, availableCd) {
            var val = inputEl.value, parts = val.split(/\s+/), cmd = parts[0].toLowerCase();
            if (parts.length === 1 && !val.endsWith(' ')) {
                var m = COMMANDS.filter(function(c){ return c.startsWith(cmd); });
                if (m.length === 1) { inputEl.value = m[0] + ' '; return; }
                return;
            }
            var partial = parts.slice(1).join(' ');
            if (cmd === 'cat') {
                var m = availableFiles.filter(function(f){ return f.startsWith(partial); });
                if (m.length === 1) inputEl.value = 'cat ' + m[0];
            } else if (cmd === 'cd') {
                var m = availableCd.filter(function(d){ return d.startsWith(partial); });
                if (m.length === 1) inputEl.value = 'cd ' + m[0];
            } else if (cmd === 'ls') {
                var flags = ['-l', '-la'], idx = flags.indexOf(partial);
                inputEl.value = 'ls ' + flags[(idx + 1) % flags.length];
            }
        }
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') { e.preventDefault(); tabComplete(input, FILES, CD_MAIN); }
        });

        function doLs(args) {
            var fc = args.join('').replace(/-/g,'').toLowerCase();
            var wantsLong = fc.indexOf('l') !== -1, wantsAll = fc.indexOf('a') !== -1;
            var files = [
                { name: 'README',      desc: 'critical services overview and managing uptime' },
                { name: 'ssh.conf',    desc: 'secure sshd_config settings' },
                { name: 'vsftpd.conf', desc: 'vsftpd ftp server security config' },
                { name: 'apache.conf', desc: 'apache2 web server security config' },
                { name: 'nginx.conf',  desc: 'nginx web server security config' },
                { name: 'php.conf',    desc: 'php security settings (php.ini)' },
                { name: 'mysql.conf',  desc: 'mysql / mariadb security config' }
            ];
            if (wantsLong) {
                addLine('total ' + files.length, 'log-line--info');
                files.forEach(function(f) {
                    var p = document.createElement('p'); p.className = 'log-line log-line--dir';
                    var perm = document.createElement('span'); perm.className = 'dir-perm'; perm.textContent = '-rw-r--r--';
                    var name = document.createElement('span'); name.className = 'dir-name ' + (read[f.name] ? 'file-read' : 'file-unread'); name.textContent = f.name;
                    var desc = document.createElement('span'); desc.className = 'dir-desc'; desc.textContent = f.desc;
                    p.appendChild(perm); p.appendChild(name); p.appendChild(desc); log.appendChild(p);
                });
            } else {
                var row = document.createElement('p'); row.className = 'log-line log-line--ls';
                files.forEach(function(f) {
                    var span = document.createElement('span');
                    span.className = 'dir-name ' + (read[f.name] ? 'file-read' : 'file-unread');
                    span.textContent = f.name; row.appendChild(span);
                });
                log.appendChild(row);
            }
            if (wantsLong && wantsAll) addLine('# ls -la in a config directory — checking permissions is the right instinct', 'log-line--easter');
            updatePlaceholder();
        }

        function catReadme() {
            addBlank();
            var anchor = addLine('─── README ───────────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('CRITICAL SERVICES AND MANAGING UPTIME', 'log-line--heading');
            addBlank();
            addLine('a service is a background process that provides functionality to the system', 'log-line--body');
            addLine('or network. services are managed by systemd on most modern linux systems.', 'log-line--body');
            addBlank();
            addLine('in competition, you typically need to:', 'log-line--body');
            addLine('  1. keep required services running (sshd, apache, mysql, etc.)', 'log-line--indent');
            addLine('  2. disable services that should not be running', 'log-line--indent');
            addLine('  3. fix/harden the configuration of required services', 'log-line--indent');
            addBlank();
            addLine('MANAGING SERVICE UPTIME', 'log-line--heading');
            addBlank();
            addLine('check if a service is running:', 'log-line--body');
            addLine('$ systemctl status sshd', 'log-line--cmd-example');
            addLine('$ systemctl is-active sshd', 'log-line--cmd-example');
            addBlank();
            addLine('restart a service (need this to apply config changes):', 'log-line--body');
            addLine('$ sudo systemctl restart sshd', 'log-line--cmd-example');
            addLine('$ sudo systemctl reload sshd        # reload config without full restart', 'log-line--cmd-example');
            addBlank();
            addLine('make a service start automatically on boot:', 'log-line--body');
            addLine('$ sudo systemctl enable sshd', 'log-line--cmd-example');
            addBlank();
            addLine('check logs for a service (if you have errors starting it):', 'log-line--body');
            addLine('$ sudo journalctl -u sshd -n 50     # last 50 log lines for sshd', 'log-line--cmd-example');
            addLine('$ sudo journalctl -xe               # full recent system log with errors', 'log-line--cmd-example');
            addBlank();
            addLine('DISCLAIMER', 'log-line--heading');
            addBlank();
            addLine('this section covers only the basics of each service\'s security configuration.', 'log-line--body');
            addLine('there may be additional vulnerabilities relating to the service even outside of it\'s configuration.', 'log-line--body');
            addLine('these are some commonly tested settings in competition.. and may NOT be practical for real use (oops)', 'log-line--body');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catSsh() {
            addBlank();
            var anchor = addLine('─── ssh.conf ─────────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('SSHD SECURE CONFIGURATION', 'log-line--heading');
            addBlank();
            addLine('config file: /etc/ssh/sshd_config', 'log-line--body');
            addLine('edit with:   sudo nano /etc/ssh/sshd_config', 'log-line--body');
            addLine('apply with:  sudo systemctl restart sshd', 'log-line--body');
            addBlank();
            addLine('CORRECT FILE AND DIRECTORY PERMISSIONS', 'log-line--heading');
            addBlank();
            addLine('$ sudo chmod 600 /etc/ssh/sshd_config        # only root can read/write', 'log-line--cmd-example');
            addLine('$ sudo chown root:root /etc/ssh/sshd_config', 'log-line--cmd-example');
            addLine('$ sudo chmod 700 ~/.ssh                      # private ssh dir', 'log-line--cmd-example');
            addLine('$ sudo chmod 600 ~/.ssh/authorized_keys      # private key file', 'log-line--cmd-example');
            addLine('$ sudo chmod 644 ~/.ssh/id_rsa.pub           # public key (can be world-readable)', 'log-line--cmd-example');
            addBlank();
            addLine('RECOMMENDED SSHD_CONFIG SETTINGS', 'log-line--heading');
            addBlank();
            addLine('Protocol 2                    # only use SSHv2 (v1 is broken)', 'log-line--cmd-example');
            addLine('LogLevel INFO                 # log login attempts and key usage', 'log-line--cmd-example');
            addLine('X11Forwarding no              # disable GUI forwarding', 'log-line--cmd-example');
            addLine('MaxAuthTries 4                # lock out after 4 failed attempts', 'log-line--cmd-example');
            addLine('IgnoreRhosts yes              # ignore .rhosts files (insecure legacy)', 'log-line--cmd-example');
            addLine('HostbasedAuthentication no    # disable host-based auth (insecure)', 'log-line--cmd-example');
            addLine('PasswordAuthentication no     # keys > passwords', 'log-line--cmd-example');
            addLine('PermitRootLogin no            # never allow direct root login over ssh', 'log-line--cmd-example');
            addLine('PermitEmptyPasswords no       # block accounts with no password', 'log-line--cmd-example');
            addLine('PermitUserEnvironment no      # prevent users from injecting env vars', 'log-line--cmd-example');
            addLine('PubkeyAuthentication yes      # allow key-based login', 'log-line--cmd-example');
            addLine('RSAAuthentication yes         # allow RSA keys', 'log-line--cmd-example');
            addLine('Ciphers aes128-ctr,aes192-ctr,aes256-ctr   # strong ciphers only', 'log-line--cmd-example');
            addLine('ClientAliveInterval 600       # send keepalive every 600s (10 min)', 'log-line--cmd-example');
            addLine('ClientAliveCountMax 0         # disconnect if no response to keepalive', 'log-line--cmd-example');
            addLine('Banner /etc/issue.net         # show legal warning before login', 'log-line--cmd-example');
            addLine('AllowGroups sudo wheel root   # only allow users in these groups', 'log-line--cmd-example');
            addLine('PermitTunnel no               # disable SSH tunneling', 'log-line--cmd-example');
            addLine('TCPKeepAlive yes              # keep connections alive at the TCP level', 'log-line--cmd-example');
            addBlank();
            addLine('NOTES', 'log-line--heading');
            addBlank();
            addLine('  PasswordAuthentication no requires that authorized_keys is set up first.', 'log-line--indent');
            addLine('  otherwise you might lock yourself out of ssh..', 'log-line--indent');
            addLine('  AllowGroups overrides all other user settings', 'log-line--indent');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catVsftpd() {
            addBlank();
            var anchor = addLine('─── vsftpd.conf ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('VSFTPD — VERY SECURE FTP DAEMON', 'log-line--heading');
            addBlank();
            addLine('vsftpd is one of the most common FTP servers on linux.', 'log-line--body');
            addLine('FTP is an unencrypted protocol — credentials and data are sent in plaintext.', 'log-line--body');
            addLine('if your competition scenario requires FTP, vsftpd with these settings is the', 'log-line--body');
            addLine('safest option. if it is NOT required, remove it entirely:', 'log-line--body');
            addLine('$ sudo apt purge vsftpd', 'log-line--cmd-example');
            addBlank();
            addLine('config file: /etc/vsftpd.conf', 'log-line--body');
            addLine('edit with:   sudo nano /etc/vsftpd.conf', 'log-line--body');
            addLine('apply with:  sudo systemctl restart vsftpd', 'log-line--body');
            addLine('allowed users: /etc/ftpusers', 'log-line--body');
            addBlank();
            addLine('$ chmod 744 /srv/ftp  # only root can write to the ftp directory', 'log-line--cmd-example');
            addBlank();
            addLine('RECOMMENDED VSFTPD.CONF SETTINGS', 'log-line--heading');
            addBlank();
            addLine('anonymous_enable=NO           # never allow anonymous login', 'log-line--cmd-example');
            addLine('local_enable=YES              # allow local system users to log in', 'log-line--cmd-example');
            addLine('write_enable=YES              # allow uploads (only if needed)', 'log-line--cmd-example');
            addLine('local_umask=022               # new files created as 644', 'log-line--cmd-example');
            addLine('chroot_local_user=YES         # jail users to their home directory', 'log-line--cmd-example');
            addLine('allow_writeable_chroot=NO     # prevent writeable chroot escape', 'log-line--cmd-example');
            addLine('xferlog_enable=YES            # log all file transfers', 'log-line--cmd-example');
            addLine('xferlog_std_format=YES        # use standard log format', 'log-line--cmd-example');
            addLine('listen=YES                    # run as standalone daemon', 'log-line--cmd-example');
            addLine('listen_ipv6=NO                # disable if not needed', 'log-line--cmd-example');
            addLine('pam_service_name=vsftpd       # use PAM for authentication', 'log-line--cmd-example');
            addLine('userlist_enable=YES           # enable user whitelist', 'log-line--cmd-example');
            addLine('userlist_deny=NO              # allow only listed users (in /etc/vsftpd.userlist)', 'log-line--cmd-example');
            addLine('ssl_enable=YES                # enable TLS (FTPS)', 'log-line--cmd-example');
            addLine('force_local_logins_ssl=YES    # require TLS for local logins', 'log-line--cmd-example');
            addLine('force_local_data_ssl=YES      # require TLS for data transfers', 'log-line--cmd-example');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catApache() {
            addBlank();
            var anchor = addLine('─── apache.conf ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('APACHE2 — WEB SERVER', 'log-line--heading');
            addBlank();
            addLine('apache2 (httpd) is one of the most widely deployed web servers.', 'log-line--body');
            addLine('it serves web pages and runs web applications.', 'log-line--body');
            addBlank();
            addLine('main config:      /etc/apache2/apache2.conf  (or /etc/httpd/httpd.conf)', 'log-line--body');
            addLine('site configs:     /etc/apache2/sites-available/', 'log-line--body');
            addLine('module configs:   /etc/apache2/mods-enabled/', 'log-line--body');
            addLine('PS: remember to check for bad modules! use a baseline!', 'log-line--body');
            addLine('edit with:        sudo nano /etc/apache2/apache2.conf', 'log-line--body');
            addLine('apply with:       sudo systemctl restart apache2', 'log-line--body');
            addBlank();
            addLine('RECOMMENDED SECURITY SETTINGS', 'log-line--heading');
            addBlank();
            addLine('hide server version info (in apache2.conf or security.conf):', 'log-line--body');
            addLine('  ServerTokens Prod             # only show "Apache" not the version', 'log-line--cmd-example');
            addLine('  ServerSignature Off           # remove version from error pages', 'log-line--cmd-example');
            addBlank();
            addLine('disable directory listing (prevents exposing file structure):', 'log-line--body');
            addLine('  Options -Indexes              # add to your VirtualHost or <Directory> block', 'log-line--cmd-example');
            addBlank();
            addLine('disable unused modules (reduce attack surface):', 'log-line--body');
            addLine('$ sudo a2dismod status          # disable mod_status (exposes server info)', 'log-line--cmd-example');
            addLine('$ sudo a2dismod autoindex       # disable directory listing module', 'log-line--cmd-example');
            addLine('$ sudo a2enmod ssl              # enable HTTPS', 'log-line--cmd-example');
            addLine('$ sudo a2enmod headers          # enable security headers', 'log-line--cmd-example');
            addBlank();
            addLine('add security headers (in a VirtualHost or .htaccess):', 'log-line--body');
            addLine('  Header always set X-Frame-Options "SAMEORIGIN"', 'log-line--cmd-example');
            addLine('  Header always set X-Content-Type-Options "nosniff"', 'log-line--cmd-example');
            addLine('  Header always set X-XSS-Protection "1; mode=block"', 'log-line--cmd-example');
            addBlank();
            addLine('restrict access to sensitive files (.htaccess, .env, .git):', 'log-line--body');
            addLine('  <FilesMatch "^\\.(htaccess|env|git)">', 'log-line--cmd-example');
            addLine('    Require all denied', 'log-line--cmd-example');
            addLine('  </FilesMatch>', 'log-line--cmd-example');
            addBlank();
            addLine('run apache as a non-root user:', 'log-line--body');
            addLine('  User www-data', 'log-line--cmd-example');
            addLine('  Group www-data', 'log-line--cmd-example');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catNginx() {
            addBlank();
            var anchor = addLine('─── nginx.conf ───────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('NGINX — WEB SERVER AND REVERSE PROXY', 'log-line--heading');
            addBlank();
            addLine('nginx is a high-performance web server often used as a reverse proxy,', 'log-line--body');
            addLine('load balancer, and for serving static files.', 'log-line--body');
            addBlank();
            addLine('main config:  /etc/nginx/nginx.conf', 'log-line--body');
            addLine('site configs: /etc/nginx/sites-available/', 'log-line--body');
            addLine('apply with:   sudo systemctl restart nginx', 'log-line--body');
            addLine('test config:  sudo nginx -t   (always run before restarting)', 'log-line--body');
            addBlank();
            addLine('RECOMMENDED SECURITY SETTINGS', 'log-line--heading');
            addBlank();
            addLine('hide nginx version (in http block):', 'log-line--body');
            addLine('  server_tokens off;', 'log-line--cmd-example');
            addBlank();
            addLine('limit request size (prevents upload abuse):', 'log-line--body');
            addLine('  client_max_body_size 1M;', 'log-line--cmd-example');
            addBlank();
            addLine('add security headers (in server block):', 'log-line--body');
            addLine('  add_header X-Frame-Options "SAMEORIGIN";', 'log-line--cmd-example');
            addLine('  add_header X-Content-Type-Options "nosniff";', 'log-line--cmd-example');
            addLine('  add_header X-XSS-Protection "1; mode=block";', 'log-line--cmd-example');
            addLine('  add_header Referrer-Policy "strict-origin-when-cross-origin";', 'log-line--cmd-example');
            addBlank();
            addLine('disable directory listing:', 'log-line--body');
            addLine('  autoindex off;', 'log-line--cmd-example');
            addBlank();
            addLine('block access to hidden files:', 'log-line--body');
            addLine('  location ~ /\\. { deny all; }', 'log-line--cmd-example');
            addBlank();
            addLine('rate limiting (prevent brute-force and DoS):', 'log-line--body');
            addLine('  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;', 'log-line--cmd-example');
            addLine('  limit_req zone=login burst=5 nodelay;  # in the location block', 'log-line--cmd-example');
            addBlank();
            addLine('run nginx as a non-root user (top of nginx.conf):', 'log-line--body');
            addLine('  user www-data;', 'log-line--cmd-example');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catPhp() {
            addBlank();
            var anchor = addLine('─── php.conf ─────────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('PHP SECURITY SETTINGS', 'log-line--heading');
            addBlank();
            addLine('PHP is the most common server-side scripting language for web applications.', 'log-line--body');
            addLine('misconfigured PHP is one of the top causes of web application compromise.', 'log-line--body');
            addBlank();
            addLine('config file: /etc/php/<version>/apache2/php.ini  (apache)', 'log-line--body');
            addLine('             /etc/php/<version>/fpm/php.ini        (nginx with php-fpm)', 'log-line--body');
            addLine('apply with:  sudo systemctl restart apache2  (or php-fpm)', 'log-line--body');
            addBlank();
            addLine('RECOMMENDED PHP.INI SETTINGS', 'log-line--heading');
            addBlank();
            addLine('hide PHP version from headers and error pages:', 'log-line--body');
            addLine('  expose_php = Off', 'log-line--cmd-example');
            addBlank();
            addLine('disable dangerous functions that allow command execution:', 'log-line--body');
            addLine('  disable_functions = exec,passthru,shell_exec,system,proc_open,popen,', 'log-line--cmd-example');
            addLine('                      curl_exec,curl_multi_exec,parse_ini_file,show_source', 'log-line--cmd-example');
            addBlank();
            addLine('disable remote file inclusion (common attack vector):', 'log-line--body');
            addLine('  allow_url_fopen = Off', 'log-line--cmd-example');
            addLine('  allow_url_include = Off', 'log-line--cmd-example');
            addBlank();
            addLine('hide errors from end users (show them in logs only):', 'log-line--body');
            addLine('  display_errors = Off', 'log-line--cmd-example');
            addLine('  log_errors = On', 'log-line--cmd-example');
            addLine('  error_log = /var/log/php_errors.log', 'log-line--cmd-example');
            addBlank();
            addLine('limit file uploads:', 'log-line--body');
            addLine('  file_uploads = On                  # set to Off if uploads not needed', 'log-line--cmd-example');
            addLine('  upload_max_filesize = 2M', 'log-line--cmd-example');
            addLine('  max_file_uploads = 5', 'log-line--cmd-example');
            addBlank();
            addLine('set a safe open_basedir (restrict which dirs PHP can access):', 'log-line--body');
            addLine('  open_basedir = /var/www/html:/tmp', 'log-line--cmd-example');
            addBlank();
            addLine('session security:', 'log-line--body');
            addLine('  session.cookie_httponly = 1        # prevent JS from reading session cookie', 'log-line--cmd-example');
            addLine('  session.cookie_secure = 1          # only send cookie over HTTPS', 'log-line--cmd-example');
            addLine('  session.use_strict_mode = 1        # reject uninitialized session IDs', 'log-line--cmd-example');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catMysql() {
            addBlank();
            var anchor = addLine('─── mysql.conf ───────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('MYSQL / MARIADB — DATABASE SERVER', 'log-line--heading');
            addBlank();
            addLine('MySQL and MariaDB are the most common relational databases on linux.', 'log-line--body');
            addLine('MariaDB is a drop-in replacement for MySQL with the same commands.', 'log-line--body');
            addLine('a compromised database can expose all stored data — secure it carefully.', 'log-line--body');
            addBlank();
            addLine('config file: /etc/mysql/mysql.conf.d/mysqld.cnf', 'log-line--body');
            addLine('apply with:  sudo systemctl restart mysql', 'log-line--body');
            addBlank();
            addLine('INITIAL SETUP — RUN THIS FIRST', 'log-line--heading');
            addBlank();
            addLine('$ sudo mysql_secure_installation', 'log-line--cmd-example');
            addLine('  this script walks through the most important security steps:', 'log-line--indent');
            addLine('  — set a root password', 'log-line--indent');
            addLine('  — remove anonymous users', 'log-line--indent');
            addLine('  — disable remote root login', 'log-line--indent');
            addLine('  — remove the test database', 'log-line--indent');
            addLine('  — reload privilege tables', 'log-line--indent');
            addBlank();
            addLine('RECOMMENDED MYSQLD.CNF SETTINGS', 'log-line--heading');
            addBlank();
            addLine('bind to localhost only (prevents remote connections):', 'log-line--body');
            addLine('  bind-address = 127.0.0.1', 'log-line--cmd-example');
            addBlank();
            addLine('disable local file loading (prevents reading system files via SQL):', 'log-line--body');
            addLine('  local-infile = 0', 'log-line--cmd-example');
            addBlank();
            addLine('log all queries (useful for auditing in competitions):', 'log-line--body');
            addLine('  general_log = 1', 'log-line--cmd-example');
            addLine('  general_log_file = /var/log/mysql/general.log', 'log-line--cmd-example');
            addBlank();
            addLine('run mysql as the mysql user (check this is set):', 'log-line--body');
            addLine('  user = mysql', 'log-line--cmd-example');
            addBlank();
            addLine('USEFUL DATABASE COMMANDS', 'log-line--heading');
            addBlank();
            addLine('$ sudo mysql -u root -p                 # log in as root', 'log-line--cmd-example');
            addBlank();
            addLine('inside the mysql shell:', 'log-line--body');
            addLine('  SELECT user, host, plugin FROM mysql.user;   # list all users', 'log-line--cmd-example');
            addLine('  SHOW GRANTS FOR \'user\'@\'host\';               # see what a user can do', 'log-line--cmd-example');
            addLine('  DROP USER \'anonymous\'@\'localhost\';            # remove anonymous user', 'log-line--cmd-example');
            addLine('  ALTER USER \'root\'@\'localhost\' IDENTIFIED BY \'newpassword\';  # set root password', 'log-line--cmd-example');
            addLine('  FLUSH PRIVILEGES;                            # apply changes', 'log-line--cmd-example');
            addBlank();
            addLine('things to check in competitions:', 'log-line--body');
            addLine('  — any user with host % (allows connections from anywhere)', 'log-line--indent');
            addLine('  — anonymous users (empty username)', 'log-line--indent');
            addLine('  — the test database (remove it)', 'log-line--indent');
            addLine('  — accounts with GRANT ALL PRIVILEGES that shouldn\'t have it', 'log-line--indent');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function doCat(target) {
            var anchor;
            if      (target === 'readme')       { anchor = catReadme();  read['README']        = true; }
            else if (target === 'ssh.conf')     { anchor = catSsh();     read['ssh.conf']      = true; }
            else if (target === 'vsftpd.conf')  { anchor = catVsftpd();  read['vsftpd.conf']   = true; }
            else if (target === 'apache.conf')  { anchor = catApache();  read['apache.conf']   = true; }
            else if (target === 'nginx.conf')   { anchor = catNginx();   read['nginx.conf']    = true; }
            else if (target === 'php.conf')     { anchor = catPhp();     read['php.conf']      = true; }
            else if (target === 'mysql.conf')   { anchor = catMysql();   read['mysql.conf']    = true; }
            else {
                addLine('cat: ' + target + ': No such file or directory', 'log-line--error');
                return;
            }
            updatePlaceholder();
            if (anchor) scrollToEl(anchor);
            if (FILES.every(function(f){ return read[f]; })) {
                inputRow.style.display = 'none';
                hint.style.display = 'flex';
                document.getElementById('nav-input').focus();
            }
        }

        function handleCmd(raw, isNav) {
            addLine(PROMPT + raw, 'log-line--cmd');
            var anchorIndex = log.children.length;
            var parts = raw.split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);

            if (cmd === 'ls') {
                doLs(args);
            } else if (cmd === 'cat') {
                if (!args[0]) addLine('cat: missing operand', 'log-line--error');
                else doCat(args[0].toLowerCase());
            } else if (cmd === 'cd') {
                var target = args.join('');
                if (isNav) {
                    var routes = {
                        '..': 'pas.html', '~': 'index.html', '/home': 'index.html',
                        '../../basics': 'basics.html', '../../users': 'users.html',
                        '../../passwords': 'passwords.html', '../../files': 'files.html',
                        '../../ssh': 'ssh.html', '../../firewall': 'firewall.html',
                        '../../backdoors': 'backdoors.html'
                    };
                    if (routes[target]) {
                        addLine('leaving config/ ...', 'log-line--info');
                        document.getElementById('nav-input').disabled = true;
                        setTimeout(function(){ window.location.href = routes[target]; }, 400);
                    } else {
                        addLine('bash: cd: ' + target + ': No such file or directory', 'log-line--error');
                    }
                } else {
                    if (!target || target === '..') {
                        window.location.href = 'pas.html';
                    } else if (target === '~' || target === '/home') {
                        window.location.href = 'index.html';
                    } else {
                        addLine('bash: cd: ' + target + ': No such file or directory', 'log-line--error');
                    }
                }
            } else if (cmd === 'pwd') {
                addLine('/home/frhs/services/config', 'log-line--info');
            } else {
                addLine('bash: ' + cmd + ': command not found', 'log-line--error');
            }

            var anchor = log.children[anchorIndex];
            if (anchor) scrollToEl(anchor);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            var raw = input.value.trim(); if (!raw) return;
            input.value = ''; handleCmd(raw, false);
        });

        var navInput = document.getElementById('nav-input');
        navInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') { e.preventDefault(); tabComplete(navInput, FILES, CD_NAV); return; }
            if (e.key !== 'Enter') return;
            var raw = navInput.value.trim(); if (!raw) return;
            navInput.value = ''; handleCmd(raw, true);
        });

        input.focus();
    })();
    </script>
</body>
