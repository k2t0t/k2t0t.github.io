<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>services/ — need help on linux?</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .log-line--heading     { color: var(--accent-amber-bright); font-weight: 700; font-size: 1rem; margin-top: 6px; }
        .log-line--body        { color: var(--text-secondary); padding-left: 2px; }
        .log-line--indent      { color: var(--text-secondary); padding-left: 20px; }
        .log-line--cmd-example { color: var(--accent-amber); padding-left: 20px; }
        .log-line--divider     { color: var(--border-strong); letter-spacing: 2px; }
        .terminal-log          { margin-bottom: 12px; }
        .file-unread           { color: var(--text-primary); }
        .file-read             { color: var(--text-dim); }
    </style>
</head>
<body>
    <p class="eyebrow"><span class="prompt-symbol">frhs@ubuntu:~/home/frhs/services#</span></p>
    <h1>welcome to programs & services</h1>
    <h2>packages, services, updates, and what shouldn't be on your system</h2>

    <div id="terminal-log" class="terminal-log" role="log" aria-live="polite"></div>

    <div class="terminal-input" id="input-row">
        <span class="prompt-symbol" id="prompt-label">frhs@ubuntu:~/home/frhs/services#</span>
        <input type="text" id="cmd-input" class="cmd-input"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="try: ls" aria-label="Terminal command input">
    </div>

    <div class="terminal-input" id="nav-hint" style="display:none">
        <span class="prompt-symbol">frhs@ubuntu:~/home/frhs/services#</span>
        <input type="text" id="nav-input" class="cmd-input"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="cd .. to go back" aria-label="Navigation input">
    </div>

    <noscript>
        <p>Enable JavaScript to use the interactive terminal.</p>
        <a href="index.html"><button>Return to Homepage</button></a>
    </noscript>

    <script>
    (function () {
        var PROMPT = 'frhs@ubuntu:~/home/frhs/services# ';
        var input       = document.getElementById('cmd-input');
        var log         = document.getElementById('terminal-log');
        var hint        = document.getElementById('nav-hint');
        var inputRow    = document.getElementById('input-row');

        var read = {
            'introduction.txt': false,
            'commands.txt':     false,
            'updates.txt':      false,
            'programs.txt':     false
        };
        var FILES    = Object.keys(read);
        var COMMANDS = ['ls', 'cat', 'cd', 'pwd'];
        var CD_MAIN  = ['..', '~', '/home', 'services'];
        var CD_NAV   = ['..', '/home', '../basics', '../users', '../passwords', '../files', '../ssh', '../firewall', '../backdoors'];

        function addLine(text, cls) {
            var p = document.createElement('p');
            p.className = 'log-line ' + (cls || '');
            p.textContent = text;
            log.appendChild(p);
            return p;
        }
        function addBlank() { return addLine('', ''); }
        function scrollToEl(el) {
            requestAnimationFrame(function() { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        }
        function updatePlaceholder() {
            var unread = FILES.filter(function(f){ return !read[f]; });
            input.placeholder = unread.length === 0
                ? 'all files read! cd services/ or cd .. to go back'
                : 'try: cat ' + unread[0];
        }

        function tabComplete(inputEl, availableFiles, availableCd) {
            var val = inputEl.value, parts = val.split(/\s+/), cmd = parts[0].toLowerCase();
            if (parts.length === 1 && !val.endsWith(' ')) {
                var m = COMMANDS.filter(function(c){ return c.startsWith(cmd); });
                if (m.length === 1) { inputEl.value = m[0] + ' '; return; }
                return;
            }
            var partial = parts.slice(1).join(' ');
            if (cmd === 'cat') {
                var m = availableFiles.filter(function(f){ return f.startsWith(partial); });
                if (m.length === 1) inputEl.value = 'cat ' + m[0];
            } else if (cmd === 'cd') {
                var m = availableCd.filter(function(d){ return d.startsWith(partial); });
                if (m.length === 1) inputEl.value = 'cd ' + m[0];
            } else if (cmd === 'ls') {
                var flags = ['-l', '-la'], idx = flags.indexOf(partial);
                inputEl.value = 'ls ' + flags[(idx + 1) % flags.length];
            }
        }
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') { e.preventDefault(); tabComplete(input, FILES, CD_MAIN); }
        });

        function doLs(args) {
            var fc = args.join('').replace(/-/g,'').toLowerCase();
            var wantsLong = fc.indexOf('l') !== -1, wantsAll = fc.indexOf('a') !== -1;
            var items = [
                { name: 'introduction.txt', type: 'f', desc: 'programs, services, and package managers on linux' },
                { name: 'commands.txt',     type: 'f', desc: 'apt, systemctl, service — viewing and managing packages' },
                { name: 'updates.txt',      type: 'f', desc: 'keeping the system up to date with apt and dnf' },
                { name: 'programs.txt',     type: 'f', desc: 'prohibited software, games, and baselines' },
                { name: 'services/',        type: 'd', desc: 'service-specific configs — ssh, vsftpd, apache, nginx...' }
            ];
            if (wantsLong) {
                addLine('total ' + items.length, 'log-line--info');
                items.forEach(function(f) {
                    var p = document.createElement('p'); p.className = 'log-line log-line--dir';
                    var perm = document.createElement('span'); perm.className = 'dir-perm';
                    perm.textContent = f.type === 'd' ? 'drwxr-xr-x' : '-rw-r--r--';
                    var name = document.createElement('span');
                    name.className = 'dir-name ' + (f.type === 'f' && read[f.name] ? 'file-read' : 'file-unread');
                    name.textContent = f.name;
                    var desc = document.createElement('span'); desc.className = 'dir-desc'; desc.textContent = f.desc;
                    p.appendChild(perm); p.appendChild(name); p.appendChild(desc); log.appendChild(p);
                });
            } else {
                var row = document.createElement('p'); row.className = 'log-line log-line--ls';
                items.forEach(function(f) {
                    var span = document.createElement('span');
                    span.className = 'dir-name ' + (f.type === 'f' && read[f.name] ? 'file-read' : 'file-unread');
                    span.textContent = f.name; row.appendChild(span);
                });
                log.appendChild(row);
            }
            if (wantsLong && wantsAll) addLine('# ls -la is always a good call', 'log-line--easter');
            updatePlaceholder();
        }

        function catIntroduction() {
            addBlank();
            var anchor = addLine('─── introduction.txt ─────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('PROGRAMS, SERVICES, AND PACKAGES', 'log-line--heading');
            addBlank();
            addLine('linux software is organized into packages — bundles of files that make up a', 'log-line--body');
            addLine('program. packages are installed, updated, and removed through package managers.', 'log-line--body');
            addBlank();
            addLine('a service (also called a daemon) is a program that runs in the background,', 'log-line--body');
            addLine('often starting at boot, waiting to respond to requests.', 'log-line--body');
            addLine('examples: sshd (handles SSH connections), apache2 (serves web pages),', 'log-line--body');
            addLine('cron (runs scheduled tasks), ufw (firewall).', 'log-line--body');
            addBlank();
            addLine('PACKAGE MANAGERS', 'log-line--heading');
            addBlank();
            addLine('apt  (Advanced Package Tool) — ubuntu, debian, and derivatives', 'log-line--body');
            addLine('  this is the most common tool and is pretty easy to use:', 'log-line--indent');
            addLine('$ sudo apt update                  # refresh the package list from repositories', 'log-line--cmd-example');
            addLine('$ sudo apt install package         # install a package', 'log-line--cmd-example');
            addLine('$ sudo apt remove package          # remove a package (keep config files)', 'log-line--cmd-example');
            addLine('$ sudo apt purge package           # remove a package AND its config files', 'log-line--cmd-example');
            addLine('$ sudo apt upgrade                 # upgrade all installed packages', 'log-line--cmd-example');
            addBlank();
            addLine('dnf  — fedora, rhel 8+, centos stream', 'log-line--body');
            addLine('$ sudo dnf install package', 'log-line--cmd-example');
            addLine('$ sudo dnf remove package', 'log-line--cmd-example');
            addLine('$ sudo dnf update', 'log-line--cmd-example');
            addBlank();
            addLine('dpkg  — low-level debian package tool (apt uses this underneath)', 'log-line--body');
            addLine('$ sudo dpkg -i package.deb         # install a local .deb file', 'log-line--cmd-example');
            addLine('$ sudo dpkg -r package             # remove a package', 'log-line--cmd-example');
            addLine('$ dpkg -l                          # list all installed packages', 'log-line--cmd-example');
            addLine('$ dpkg -l | grep packagename       # check if a specific package is installed', 'log-line--cmd-example');
            addBlank();
            addLine('CRITICAL SERVICES', 'log-line--heading');
            addBlank();
            addLine('you will often be given a README telling you some services you need to keep running!', 'log-line--body');
            addLine('most of the time there WILL be things that you need to delete, but this does NOT mean', 'log-line--body');
            addLine('you should go deleting everything that isn\'t explicitly stated in the README.', 'log-line--body');
            addBlank();
            addLine('become familiar with which services are critical and which can be safely disabled.', 'log-line--body');
            addLine('stay safe and don\'t brick your machine!')
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catCommands() {
            addBlank();
            var anchor = addLine('─── commands.txt ─────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('VIEWING AND MANAGING SERVICES', 'log-line--heading');
            addBlank();
            addLine('systemctl  — the main tool for managing services on systemd systems', 'log-line--heading');
            addBlank();
            addLine('$ systemctl status service         # show status of a service', 'log-line--cmd-example');
            addLine('$ systemctl start service          # start a service now', 'log-line--cmd-example');
            addLine('$ systemctl stop service           # stop a service now', 'log-line--cmd-example');
            addLine('$ systemctl restart service        # restart a service', 'log-line--cmd-example');
            addLine('$ systemctl reload service         # reload config without restarting', 'log-line--cmd-example');
            addLine('$ systemctl enable service         # start service automatically on boot', 'log-line--cmd-example');
            addLine('$ systemctl disable service        # stop service from starting on boot', 'log-line--cmd-example');
            addLine('$ systemctl is-active service      # check if a service is currently running', 'log-line--cmd-example');
            addLine('$ systemctl is-enabled service     # check if a service starts on boot', 'log-line--cmd-example');
            addLine('$ systemctl list-units --type=service          # list all active services', 'log-line--cmd-example');
            addLine('$ systemctl list-units --type=service --all    # include inactive services', 'log-line--cmd-example');
            addBlank();
            addLine('service  — older sysvinit-compatible wrapper (still common)', 'log-line--heading');
            addBlank();
            addLine('$ sudo service --status-all        # list all services and their status', 'log-line--cmd-example');
            addLine('  + = running,  - = stopped,  ? = unknown', 'log-line--indent');
            addLine('$ sudo service sshd start', 'log-line--cmd-example');
            addLine('$ sudo service sshd stop', 'log-line--cmd-example');
            addLine('$ sudo service sshd status', 'log-line--cmd-example');
            addBlank();
            addLine('VIEWING AND MANAGING PACKAGES', 'log-line--heading');
            addBlank();
            addLine('apt  — searching and listing', 'log-line--heading');
            addBlank();
            addLine('$ apt list --installed             # list all installed packages', 'log-line--cmd-example');
            addLine('$ apt list --installed | grep name # search for <name> in installed packages', 'log-line--cmd-example');
            addLine('$ apt show package                 # show info about a package', 'log-line--cmd-example');
            addBlank();
            addLine('apt-mark  — managing package hold states', 'log-line--heading');
            addBlank();
            addLine('$ apt-mark showmanual              # VERY useful, list packages installed manually by the user', 'log-line--cmd-example');
            addLine('$ apt-mark showauto                # packages installed as dependencies', 'log-line--cmd-example');
            addLine('$ sudo apt-mark hold package       # prevent a package from being upgraded', 'log-line--cmd-example');
            addLine('$ sudo apt-mark unhold package     # allow upgrades again', 'log-line--cmd-example');
            addBlank();
            addLine('dpkg  — low-level package inspection', 'log-line--heading');
            addBlank();
            addLine('$ dpkg -l                          # full list of all installed packages', 'log-line--cmd-example');
            addLine('$ dpkg -L package                  # list all files that belong to a package', 'log-line--cmd-example');
            addLine('$ dpkg -S /path/to/file            # find which package owns a file', 'log-line--cmd-example');
            addLine('$ dpkg --get-selections            # get all package selections', 'log-line--cmd-example');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catUpdates() {
            addBlank();
            var anchor = addLine('─── updates.txt ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('KEEPING THE SYSTEM UPDATED', 'log-line--heading');
            addBlank();
            addLine('keeping software up to date is one of the most impactful security measures.', 'log-line--body');
            addLine('most vulnerabilities that get exploited have patches available — they just', 'log-line--body');
            addLine('weren\'t applied. in competition, running updates almost always points.', 'log-line--body');
            addBlank();
            addLine('UPDATING WITH APT (debian / ubuntu)', 'log-line--heading');
            addBlank();
            addLine('$ sudo apt update                  # refresh package lists from repositories', 'log-line--cmd-example');
            addLine('  this does NOT install anything', 'log-line--indent');
            addLine('$ sudo apt upgrade                 # upgrade all packages to latest versions', 'log-line--cmd-example');
            addLine('$ sudo apt dist-upgrade            # upgrade, removing old packages if needed', 'log-line--cmd-example');
            addLine('$ sudo apt autoremove              # remove packages no longer needed', 'log-line--cmd-example');
            addLine('$ sudo apt autoclean               # remove cached package files', 'log-line--cmd-example');
            addBlank();
            addLine('one-liner:', 'log-line--body');
            addLine('$ sudo apt update && sudo apt dist-upgrade -y && sudo apt autoremove -y', 'log-line--cmd-example');
            addBlank();
            addLine('UPDATING WITH DNF (fedora / rhel)', 'log-line--heading');
            addBlank();
            addLine('$ sudo dnf check-update            # check what updates are available', 'log-line--cmd-example');
            addLine('$ sudo dnf update                  # update all packages', 'log-line--cmd-example');
            addLine('$ sudo dnf update package          # update a specific package', 'log-line--cmd-example');
            addLine('$ sudo dnf autoremove              # remove unneeded dependencies', 'log-line--cmd-example');
            addBlank();
            addLine('REPOSITORIES AND SOURCES', 'log-line--heading');
            addBlank();
            addLine('packages are downloaded from repositories (repos) — trusted servers maintained', 'log-line--body');
            addLine('by the distro or third parties.', 'log-line--body');
            addBlank();
            addLine('on debian/ubuntu, repos are configured in:', 'log-line--body');
            addLine('  /etc/apt/sources.list            # main sources file', 'log-line--cmd-example');
            addLine('  /etc/apt/sources.list.d/         # drop-in repo files', 'log-line--cmd-example');
            addBlank();
            addLine('in competitions, check for unauthorized or suspicious repos:', 'log-line--body');
            addLine('$ cat /etc/apt/sources.list', 'log-line--cmd-example');
            addLine('$ ls /etc/apt/sources.list.d/', 'log-line--cmd-example');
            addLine('  compare to a baseline and remove anything unexpected', 'log-line--indent');
            addBlank();
            addLine('AUTOMATIC UPDATES', 'log-line--heading');
            addBlank();
            addLine('remember to enable your automatic updates and make sure you are installing security updates!', 'log-line--body');
            addLine('unattended-upgrades automatically installs security updates on ubuntu/debian.', 'log-line--body');
            addBlank();
            addLine('$ sudo apt install unattended-upgrades', 'log-line--cmd-example');
            addLine('$ sudo dpkg-reconfigure --priority=low unattended-upgrades', 'log-line--cmd-example');
            addLine('  this opens a dialog — select Yes to enable automatic updates', 'log-line--indent');
            addBlank();
            addLine('config:', 'log-line--body');
            addLine('  /etc/apt/apt.conf.d/50unattended-upgrades    # what to update', 'log-line--cmd-example');
            addLine('  /etc/apt/apt.conf.d/20auto-upgrades          # when to run', 'log-line--cmd-example');
            addBlank();
            addLine('you can check if it\'s running with:', 'log-line--body');
            addLine('$ systemctl status unattended-upgrades', 'log-line--cmd-example');
            addBlank();
            addLine('on fedora/rhel, use dnf-automatic:', 'log-line--body');
            addLine('$ sudo dnf install dnf-automatic', 'log-line--cmd-example');
            addLine('$ sudo systemctl enable --now dnf-automatic.timer', 'log-line--cmd-example');
            addBlank();
            addLine('orrr you can just do it manually on the GUI on an app called Software & Updates.. but it might not always be there..' , 'log-line--body');
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function catPrograms() {
            addBlank();
            var anchor = addLine('─── programs.txt ─────────────────────────────────────', 'log-line--divider');
            addBlank();
            addLine('PROHIBITED PROGRAMS AND SOFTWARE AUDITING', 'log-line--heading');
            addBlank();
            addLine('competitions typically provide a list of allowed/required software.', 'log-line--body');
            addLine('anything else should be considered for removal, even if they are not inherently.. unsafe,', 'log-line--body');
            addLine('even defaults like ssh and telnet.')
            addBlank();
            addLine('COMMONLY PROHIBITED SOFTWARE', 'log-line--heading');
            addBlank();
            addLine('hacking and cracking tools:', 'log-line--body');
            addLine('  john / john-the-ripper  — password cracker', 'log-line--cmd-example');
            addLine('  hashcat                 — GPU password cracker', 'log-line--cmd-example');
            addLine('  hydra                   — network brute-force tool', 'log-line--cmd-example');
            addLine('  nmap                    — network scanner (sometimes prohibited)', 'log-line--cmd-example');
            addLine('  netcat / nc             — network swiss army knife, often misused', 'log-line--cmd-example');
            addLine('  metasploit              — exploitation framework', 'log-line--cmd-example');
            addLine('  wireshark               — packet sniffer', 'log-line--cmd-example');
            addLine('  aircrack-ng             — wifi cracker', 'log-line--cmd-example');
            addBlank();
            addLine('insecure/legacy protocols (should be removed outright):', 'log-line--body');
            addLine('  telnet     — unencrypted remote shell', 'log-line--cmd-example');
            addLine('  rsh        — remote shell (no encryption)', 'log-line--cmd-example');
            addLine('  ftp        — unencrypted file transfer', 'log-line--cmd-example');
            addLine('  talk/ntalk — unencrypted chat', 'log-line--cmd-example');
            addBlank();
            addLine('media and games (often prohibited):', 'log-line--body');
            addLine('  games: aisleriot, mahjongg, sudoku, etc.', 'log-line--cmd-example');
            addLine('  media: vlc, rhythmbox, totem (media players)', 'log-line--cmd-example');
            addLine('  torrents: transmission, qbittorrent, deluge', 'log-line--cmd-example');
            addBlank();
            addLine('HOW TO FIND AND REMOVE PROHIBITED PROGRAMS', 'log-line--heading');
            addBlank();
            addLine('list all manually installed packages:', 'log-line--body');
            addLine('$ apt-mark showmanual', 'log-line--cmd-example');
            addLine('do note that on mint images, this list is very long and it\'s best to just use a baseline!')
            addBlank();
            addLine('list all held packages (good to check):', 'log-line--body');
            addLine('$ apt-mark showhold', 'log-line--cmd-example');
            addBlank();
            addLine('check if a specific package is installed:', 'log-line--body');
            addLine('$ dpkg -l | grep john', 'log-line--cmd-example');
            addLine('$ dpkg -l | grep telnet', 'log-line--cmd-example');
            addBlank();
            addLine('remove a prohibited package:', 'log-line--body');
            addLine('$ sudo apt purge john              # remove package and its config files', 'log-line--cmd-example');
            addLine('$ sudo apt purge telnet netcat hydra john aircrack-ng', 'log-line--cmd-example');
            addLine('$ sudo apt autoremove              # clean up leftover dependencies', 'log-line--cmd-example');
            addBlank();
            addLine('USING A BASELINE', 'log-line--heading');
            addBlank();
            addLine('a baseline is a known-good list of installed packages for a given system.', 'log-line--body');
            addLine('comparing the current state against the baseline reveals unauthorized software.', 'log-line--body');
            addBlank();
            addLine('i like to use showmanual on a clean VM to generate a baseline to compare against.', 'log-line--body');
            addLine('you can use a website like diffchecker.com to compare the two lists and see what is different.', 'log-line--body');
            addBlank();
            addLine('you should always download and setup a clean VM so you can easily compare files you are unsure about!', 'log-line--body');
            addLine('i\'ll probably need to add that somewhere on this website...', 'log-line--body');
            addBlank();
            addLine('─── end of file ──────────────────────────────────────', 'log-line--divider');
            addBlank();
            return anchor;
        }

        function doCat(target) {
            var anchor;
            if      (target === 'introduction.txt') { anchor = catIntroduction(); read['introduction.txt'] = true; }
            else if (target === 'commands.txt')     { anchor = catCommands();     read['commands.txt']     = true; }
            else if (target === 'updates.txt')      { anchor = catUpdates();      read['updates.txt']      = true; }
            else if (target === 'programs.txt')     { anchor = catPrograms();     read['programs.txt']     = true; }
            else if (target === 'services' || target === 'services/') {
                addLine('cat: services/: Is a directory — use cd services ', 'log-line--error');
                return;
            } else {
                addLine('cat: ' + target + ': No such file or directory', 'log-line--error');
                return;
            }
            updatePlaceholder();
            if (anchor) scrollToEl(anchor);
            if (FILES.every(function(f){ return read[f]; })) updatePlaceholder();
        }

        function handleCmd(raw, isNav) {
            addLine(PROMPT + raw, 'log-line--cmd');
            var anchorIndex = log.children.length;
            var parts = raw.split(/\s+/), cmd = parts[0].toLowerCase(), args = parts.slice(1);

            if (cmd === 'ls') {
                doLs(args);
            } else if (cmd === 'cat') {
                if (!args[0]) addLine('cat: missing operand', 'log-line--error');
                else doCat(args[0].toLowerCase());
            } else if (cmd === 'cd') {
                var target = args.join('');
                if (isNav) {
                    var routes = {
                        '..': 'index.html', '~': 'index.html', '/home': 'index.html',
                        '../basics': 'basics.html', '../users': 'users.html',
                        '../passwords': 'passwords.html', '../files': 'files.html',
                        '../ssh': 'ssh.html', '../firewall': 'firewall.html',
                        '../backdoors': 'backdoors.html'
                    };
                    if (routes[target]) {
                        addLine('leaving services/ ...', 'log-line--info');
                        document.getElementById('nav-input').disabled = true;
                        setTimeout(function(){ window.location.href = routes[target]; }, 400);
                    } else if (target === 'services' || target === 'services/') {
                        addLine('entering services/ ...', 'log-line--info');
                        setTimeout(function(){ window.location.href = 'services.html'; }, 400);
                    } else {
                        addLine('bash: cd: ' + target + ': No such file or directory', 'log-line--error');
                    }
                } else {
                    if (target === 'services' || target === 'services/') {
                        addLine('entering services/ ...', 'log-line--info');
                        input.disabled = true;
                        setTimeout(function(){ window.location.href = 'services.html'; }, 400);
                    } else if (!target || target === '..' || target === '~' || target === '/home') {
                        window.location.href = 'index.html';
                    } else {
                        addLine('bash: cd: ' + target + ': No such file or directory', 'log-line--error');
                    }
                }
            } else if (cmd === 'pwd') {
                addLine('/home/frhs/services', 'log-line--info');
            } else {
                addLine('bash: ' + cmd + ': command not found', 'log-line--error');
            }

            // show nav prompt once all files read
            if (FILES.every(function(f){ return read[f]; }) && inputRow.style.display !== 'none') {
                inputRow.style.display = 'none';
                hint.style.display = 'flex';
                document.getElementById('nav-input').focus();
            }

            var anchor = log.children[anchorIndex];
            if (anchor) scrollToEl(anchor);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            var raw = input.value.trim(); if (!raw) return;
            input.value = ''; handleCmd(raw, false);
        });

        var navInput = document.getElementById('nav-input');
        navInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') { e.preventDefault(); tabComplete(navInput, FILES, CD_NAV.concat(['services'])); return; }
            if (e.key !== 'Enter') return;
            var raw = navInput.value.trim(); if (!raw) return;
            navInput.value = ''; handleCmd(raw, true);
        });

        input.focus();
    })();
    </script>
</body>
</html>
